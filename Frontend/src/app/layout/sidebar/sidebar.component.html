<aside class="sidebar" [class.sidebar--open]="open">
  <div class="sidebar__brand">
    <div>
      <h1>WorkPulse</h1>
    </div>
  </div>

  @if (currentUser$ | async; as user) {
    <div class="sidebar__identity">
      <div class="sidebar__avatar">{{ initials(user) }}</div>
      <div>
        <strong>{{ fullName(user) }}</strong>
        <small>{{ user.role }}</small>
      </div>
    </div>

    <nav class="sidebar__nav">
      <a routerLink="/today" routerLinkActive="is-active" (click)="closeDrawer.emit()">Today</a>
      <a routerLink="/my-tasks" routerLinkActive="is-active" (click)="closeDrawer.emit()">My Tasks</a>

      @if (user.role === 'Admin') {
        <p class="sidebar__section">WORK</p>
        <a routerLink="/clients" routerLinkActive="is-active" (click)="closeDrawer.emit()">Clients</a>
        <a routerLink="/projects" routerLinkActive="is-active" (click)="closeDrawer.emit()">Projects</a>
        <a routerLink="/tasks" routerLinkActive="is-active" (click)="closeDrawer.emit()">Tasks</a>
        <a routerLink="/backlog" routerLinkActive="is-active" (click)="closeDrawer.emit()">Sprint Planning / Backlog</a>
        <a routerLink="/sprints" routerLinkActive="is-active" (click)="closeDrawer.emit()">Sprint Planning</a>
        <a routerLink="/team" routerLinkActive="is-active" (click)="closeDrawer.emit()">User Management</a>
      } @else {
        <a routerLink="/backlog" routerLinkActive="is-active" (click)="closeDrawer.emit()">Backlog</a>
        <a routerLink="/sprints" routerLinkActive="is-active" (click)="closeDrawer.emit()">Sprint View</a>
      }

      <p class="sidebar__section">ACCOUNT</p>
      <a routerLink="/profile" routerLinkActive="is-active" (click)="closeDrawer.emit()">Profile</a>
      <button type="button" class="sidebar__logout" (click)="closeDrawer.emit(); logout()">Logout</button>
    </nav>
  }

</aside>
