<div class="auth-shell">
  <section class="auth-brand">
    <div class="auth-brand__mark"></div>
    <h1>WorkPulse</h1>
    <p class="auth-brand__tagline">Know what matters today.</p>
    <p class="auth-brand__body">Create your developer workspace and keep daily work focused.</p>
  </section>

  <section class="auth-panel">
    <div class="auth-panel__card">
      <p class="auth-kicker">Join WorkPulse</p>
      <h2>Create your account</h2>
      <p class="auth-help">Set up your developer profile and get started in a few moments.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
        <label>
          First Name
          <input type="text" formControlName="firstName" [class.input-error]="fieldInvalid('firstName')" />
          <small class="auth-field-error" [class.auth-field-error--visible]="fieldInvalid('firstName')">First name is required.</small>
        </label>

        <label>
          Last Name
          <input type="text" formControlName="lastName" [class.input-error]="fieldInvalid('lastName')" />
          <small class="auth-field-error" [class.auth-field-error--visible]="fieldInvalid('lastName')">Last name is required.</small>
        </label>

        <label>
          Email
          <input type="email" formControlName="email" [class.input-error]="fieldInvalid('email')" />
          <small class="auth-field-error" [class.auth-field-error--visible]="fieldInvalid('email')">Enter a valid email address.</small>
        </label>

        <label>
          Password
          <input type="password" formControlName="password" [class.input-error]="fieldInvalid('password')" />
          <small class="auth-field-error" [class.auth-field-error--visible]="fieldInvalid('password')">Use at least 8 characters with upper, lower, and a number.</small>
        </label>

        <label>
          Confirm Password
          <input type="password" formControlName="confirmPassword" [class.input-error]="fieldInvalid('confirmPassword') || passwordsMismatch" />
          <small class="auth-field-error" [class.auth-field-error--visible]="fieldInvalid('confirmPassword')">Confirm your password.</small>
          <small class="auth-field-error" [class.auth-field-error--visible]="passwordsMismatch">Passwords must match.</small>
        </label>

        <p class="auth-error" role="alert" [class.auth-error--visible]="!!errorMessage">{{ errorMessage }}</p>

        <button type="submit" [disabled]="isSubmitting" [class.button--retry]="submissionFailed">{{ submitLabel }}</button>
      </form>

      <a class="auth-link" routerLink="/login">Already have an account? Sign in</a>
    </div>
  </section>
</div>
